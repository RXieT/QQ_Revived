name: Android release APK

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 37.0
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile release Kotlin
        run: bash ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Run release unit tests
        run: bash ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Run release Lint
        run: bash ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Assemble optimized release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Xposed entry metadata
        shell: python
        run: |
          import pathlib
          import zipfile
          apks = list(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          if not apks:
              raise SystemExit('No release APK found')
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  entry = archive.read('META-INF/xposed/java_init.list').decode().strip()
                  props = archive.read('META-INF/xposed/module.prop').decode()
                  scope = archive.read('META-INF/xposed/scope.list').decode().splitlines()
                  # R8 may rename the entry class; its adapted descriptor must exist in a dex.
                  descriptor = ('L' + entry.replace('.', '/') + ';').encode()
                  dexes = [name for name in archive.namelist() if name.endswith('.dex')]
                  if not entry or not any(descriptor in archive.read(name) for name in dexes):
                      raise SystemExit(f'{apk}: module entry missing from dex: {entry!r}')
                  if 'com.tencent.qqlite' not in scope or 'minApiVersion=101' not in props:
                      raise SystemExit(f'{apk}: unexpected module metadata')
                  print(f'{apk}: verified Xposed entry {entry}')

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Revived-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release diagnostics and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Revived-release-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
