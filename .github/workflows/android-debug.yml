name: Android debug APK

on:
  push:
    branches:
      - master
      - 'fix/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run Android Lint
        run: bash ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Revived-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Revived-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
